# CI gate. Every job runs work inside the Nix dev shell so the toolchain is
# identical to local development (ADR-0008).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flakes/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: pre-commit
        run: nix develop ./.flakes -c pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flakes/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: go test
        run: nix develop ./.flakes -c go test -race -coverprofile=cover.out ./...
      - name: coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            nix develop ./.flakes -c go tool cover -func=cover.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flakes/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: goreleaser build (compile-check all targets)
        run: nix develop ./.flakes -c goreleaser build --snapshot --clean
